[package]
name = "alchemy-relay-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Relay Agent: Allocation Token → short-lived mTLS client certs (x004e / x0068 / x0088)"

[lib]
name = "alchemy_relay_agent"
path = "src/lib.rs"

[[bin]]
name = "alchemy-relay-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
env_logger = "0.11"
jsonwebtoken = "9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Human-approved (2026-11-17): Apache-2.0 OR MIT; P2-7 JWKS via ureq (replace curl).
ureq = { version = "2", features = ["json"] }

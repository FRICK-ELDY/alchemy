[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Alchemy client (x0008: OpenXR dash+Exit + system_ui + C-C/D render)"

[lints]
workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
alchemy-protocol = { workspace = true }
alchemy-shared-sim = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
bytemuck = { workspace = true }
env_logger = { workspace = true }
glam = { workspace = true }
gltf = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
prost = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
zenoh = { workspace = true }
zenoh-connect = { workspace = true }
alchemy-connect-config = { workspace = true }
openxr = { workspace = true }
ash = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
jsonwebtoken = "9"
base64 = "0.22"
png = "0.17"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
# x0044: world_jwks soft/hard/unknown-kid unit tests (same stack as host-server)
rsa = { version = "0.9", features = ["pem"] }
pkcs1 = { version = "0.7", features = ["std"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand = "0.8"

[workspace]
resolver = "2"
members = [
    "host-server",
    "app",
    "e2e-probe",
    "zenoh-connect",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.clippy]
# x002f / P3-14: every `unsafe` must state why it is sound (XR Vulkan/OpenXR path).
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Shared wire contract lives at repo-root protocol/ (not inside this workspace).
alchemy-protocol = { path = "../protocol" }
zenoh-connect = { path = "zenoh-connect" }
prost = "0.14"
zenoh = "1.10"
anyhow = "1"
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
winit = "0.30"
wgpu = "24"
env_logger = "0.11"
log = "0.4"
gltf = "1"
blake3 = "1"
glam = "0.29"
rapier3d = "0.22"
openxr = "0.22"
ash = "0.38"
naga = { version = "24", features = ["wgsl-in", "spv-out"] }

[package]
name = "host-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local authoritative space host (Slice D Rapier + Slice E host_control stub)"

[lints]
workspace = true

[features]
# Enables key-injection helpers for cargo-fuzz only (x004c).
# Do NOT enable on release / ZIP / pack-windows builds — injection APIs are for fuzz/tests.
fuzzing = []

[lib]
name = "host_server"
path = "src/lib.rs"

[[bin]]
name = "host-server"
path = "src/main.rs"

[dependencies]
alchemy-protocol = { workspace = true }
alchemy-shared-sim = { workspace = true }
anyhow = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
prost = { workspace = true }
rapier3d = { workspace = true }
zenoh = { workspace = true }
zenoh-connect = { workspace = true }
jsonwebtoken = "9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
rsa = { version = "0.9", features = ["pem"] }
pkcs1 = { version = "0.7", features = ["std"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
rand = "0.8"

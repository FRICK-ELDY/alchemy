[package]
name = "host-server-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
host-server = { path = "..", features = ["fuzzing"] }
jsonwebtoken = "9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

# Prevent this from interfering with the client workspace
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "room_token_verify"
path = "fuzz_targets/room_token_verify.rs"
test = false
doc = false
bench = false

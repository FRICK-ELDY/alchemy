[package]
name = "alchemy-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Alchemy wire contracts (Protobuf SSoT) — shared by client, host-server, and servers"

[dependencies]
prost = "0.14"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# x0069: Room-key AEAD (XChaCha20Poly1305); human-approved dependency.
chacha20poly1305 = "0.10"
base64 = "0.22"

[[bin]]
name = "manifest-seal-hash"
path = "src/bin/manifest_seal_hash.rs"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

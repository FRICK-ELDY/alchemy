[package]
name = "alchemy-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Alchemy wire contracts (Protobuf SSoT) — shared by client, host-server, and servers"

[dependencies]
prost = "0.14"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
blake3 = "1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

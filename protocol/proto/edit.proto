syntax = "proto3";

package alchemy.edit;

// Deterministic edit lane (mvcc_xpbd §4.7 / x00b2–x00b3).
// Client puts EditProposal on …/edit (AeadKind::EditProposal).
// Host puts EditCommit on the same key (AeadKind::EditCommit).
// x00b3: Reparent/SetField are live-only (host live_scene_rev); no overlay CAS.
// Spawn/Despawn may still CAS overlay (VCS debt) but Commit.scene_rev is live tip.
// x00b7: Save merges overlay→canonical; Commit.scene_rev tip is unchanged.

message EditProposal {
  bytes session_pub = 1;
  uint64 control_seq = 2;
  // Last observed host live_scene_rev via EditCommit (0 = none yet).
  // Not overlay packed revision (x00b3); optimistic locks are per-op.
  uint64 base_scene_rev = 3;
  // Client-chosen id for commit correlation.
  uint64 op_id = 4;
  repeated EditOp ops = 5;
  // Ed25519 over encode with `sig` cleared (includes room_id).
  bytes sig = 6;
  // Must match the room; bound into the signature (defense beyond AEAD AAD).
  string room_id = 7;
}

message EditOp {
  oneof op {
    EditSpawn spawn = 1;
    EditDespawn despawn = 2;
    EditReparent reparent = 3;
    EditSetField set_field = 4;
    // x00b7: persist session_overlay into canonical scene (empty body).
    EditSave save = 5;
  }
}

message EditSave {}

message EditSpawn {
  // Lowercase hex blake3 (64 chars) of the mesh blob.
  string blake3 = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  double qx = 5;
  double qy = 6;
  double qz = 7;
  double qw = 8;
  double sx = 9;
  double sy = 10;
  double sz = 11;
  // x00b5: assets-issued SpawnTicket JWT (same ticket may cover multiple blake3s).
  string spawn_ticket = 12;
}

message EditDespawn {
  uint32 entity_id = 1;
}

message EditReparent {
  uint32 child_entity_id = 1;
  // 0 = world root. Optimistic lock on current parent.
  uint32 expected_parent_entity_id = 2;
  // 0 = world root.
  uint32 new_parent_entity_id = 3;
}

message EditSetField {
  uint32 entity_id = 1;
  // See alchemy_protocol::edit_field_id.
  uint32 field_id = 2;
  bytes value = 3;
  // BLAKE3-256 of the current field encoding (optimistic lock).
  bytes expected_value_hash = 4;
}

message EditCommit {
  // Host live_scene_rev (accept only). Reject keeps prior tip.
  uint64 scene_rev = 1;
  uint64 op_id = 2;
  bytes author_session_pub = 3;
  bool accepted = 4;
  // 0 = none/accepted; see alchemy_protocol::edit_reject::*
  uint32 reject_reason = 5;
  repeated EditOp ops = 6;
  // Ed25519 over encode with `host_sig` cleared.
  bytes host_sig = 7;
}

syntax = "proto3";

package alchemy.scene;

// Slice C-C + x0009: low-frequency scene ledger (what is placed) + locomotion profile.
// Asset bytes are never embedded — only BLAKE3 refs (hex).
// PROTOCOL_PIN must bump when this schema changes incompatibly.

message SceneManifest {
  // Room id (ASCII, no `/`); matches Zenoh key segment.
  string room_id = 1;
  // Bump when entries change; unchanged republish may reuse the same revision.
  uint64 revision = 2;
  repeated SceneEntry entries = 3;
  // World-defined active locomotion profile (default Noclip when unset / UNSPECIFIED).
  LocomotionConfig locomotion = 4;
  // Must equal peer `PROTOCOL_PIN` (x0023). Client rejects mismatch.
  string protocol_pin = 5;
  // Host Ed25519 public key (32 bytes) for RenderFrame / snapshot signatures (x0023).
  bytes host_pub = 6;
}

message SceneEntry {
  uint32 entity_id = 1;
  // BLAKE3 hex of the blob in assets-server CAS.
  string blake3 = 2;
  // Optional initial pose (binary64 at the render boundary).
  double x = 3;
  double y = 4;
  double z = 5;
}

// Active locomotion mode for users in this room (world content definition).
enum LocomotionMode {
  LOCOMOTION_MODE_UNSPECIFIED = 0;
  LOCOMOTION_MODE_NOCLIP = 1;
  LOCOMOTION_MODE_FLY = 2;
  LOCOMOTION_MODE_WALK = 3;
}

message LocomotionConfig {
  LocomotionMode mode = 1;
  // Horizontal / free-move speed (m/s). Host may clamp. 0 = host default.
  float move_speed = 2;
}

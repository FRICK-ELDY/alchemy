syntax = "proto3";

package alchemy.scene;

// Slice C-C + x0009: low-frequency scene ledger (what is placed) + locomotion profile.
// Asset bytes are never embedded — only BLAKE3 refs (hex).
// PROTOCOL_PIN must bump when this schema changes incompatibly.

message SceneManifest {
  // Room id (ASCII, no `/`); matches Zenoh key segment.
  string room_id = 1;
  // Bump when entries change; unchanged republish may reuse the same revision.
  uint64 revision = 2;
  repeated SceneEntry entries = 3;
  // World-defined active locomotion profile (default Noclip when unset / UNSPECIFIED).
  LocomotionConfig locomotion = 4;
  // Must equal peer `PROTOCOL_PIN` (x0023). Client rejects mismatch.
  string protocol_pin = 5;
  // Host Ed25519 public key (32 bytes) for RenderFrame / snapshot / Presence signatures (x0023).
  bytes host_pub = 6;
  // World-issued HostAttestation JWT (RS256). Client verifies via world JWKS before
  // adopting `host_pub` (x0025). Must attest the same 32-byte key as `host_pub`.
  string host_attestation = 7;
  // World-issued ManifestSeal JWT (RS256). Client verifies via world JWKS and checks
  // `manifest_blake3` against the protobuf body with this field cleared (x0026).
  string world_seal = 8;
  // World-assigned host generation (x003a). Bumps only on host handoff (new attested key).
  // Must match HostAttestation + ManifestSeal `host_generation` claims. 0 = invalid.
  uint64 host_generation = 9;
}

message SceneEntry {
  uint32 entity_id = 1;
  // BLAKE3 hex of the blob in assets-server CAS (empty = no mesh).
  string blake3 = 2;
  // Optional initial pose (binary64 at the render boundary).
  double x = 3;
  double y = 4;
  double z = 5;
  // Cuboid half-extent (meters). 0 = not a box collider/draw proxy (x0027).
  float half_extent = 6;
  // Bit flags; see `SCENE_FLAG_*` in protocol crate (x0027).
  uint32 flags = 7;
  // Initial tint (Frame may overwrite). Unset / zero alpha → peer default.
  float r = 8;
  float g = 9;
  float b = 10;
  float a = 11;
  // Initial orientation (xyzw). Publishers should send identity (0,0,0,1);
  // proto3 zeros → consumers treat as identity (x002c).
  double qx = 12;
  double qy = 13;
  double qz = 14;
  double qw = 15;
  // Initial Frame scale. Identity (1,1,1); all-zero or non-finite → (1,1,1).
  // Does not resize Rapier colliders (half_extent remains definition size;
  // client OBB uses Frame scale — x002c).
  double sx = 16;
  double sy = 17;
  double sz = 18;
}

// Active locomotion mode for users in this room (world content definition).
enum LocomotionMode {
  LOCOMOTION_MODE_UNSPECIFIED = 0;
  LOCOMOTION_MODE_NOCLIP = 1;
  LOCOMOTION_MODE_FLY = 2;
  LOCOMOTION_MODE_WALK = 3;
}

message LocomotionConfig {
  LocomotionMode mode = 1;
  // Horizontal / free-move speed (m/s). Host may clamp. 0 = host default.
  float move_speed = 2;
}

syntax = "proto3";

package alchemy.input;

// Room Token gate + x0009 loco + x0011 Grab hold aim.
// Full action taxonomy / editor events are deferred.

message InputEvent {
  // Short-lived Room Token (JWT) issued by world-server.
  string room_token = 1;
  // Client wall-clock-ish time in milliseconds (demo / debug).
  uint64 client_time_ms = 2;
  // World-projected normalized move intent (~-1..1). Host scales by LocomotionConfig.move_speed.
  // +X = right, +Y = up, +Z = forward.
  // Desktop: client projects WASD from local mouse-look yaw (x0012); OpenXR: aim-relative thumbstick (x000a).
  float move_x = 3;
  float move_y = 4;
  float move_z = 5;
  // Optional action bits (host may ignore unused). See InputButtons.
  uint32 buttons = 6;
  // Grabbable entity to hold while GRAB is set (0 = none). Host ignores non-grabbable ids.
  uint32 grab_entity_id = 7;
  // World-space aim origin (meters): XR controller aim / Desktop eye. When GRAB + grab_entity_id != 0.
  float aim_x = 8;
  float aim_y = 9;
  float aim_z = 10;
  // Explicit leave (x0019). Host verifies token then reclaims Presence immediately; move/grab ignored.
  bool leave = 11;
  // Ed25519 public key (32 bytes) identifying this Intent session (x0023). Required every Intent.
  bytes session_pub = 12;
  // Monotonic per-session sequence; host rejects `seq <= last_seq`.
  uint64 intent_seq = 13;
  // Ed25519 signature (64 bytes) over encode with `intent_sig` cleared (x0023).
  // Steady Intent may omit `room_token`; bind / Token refresh must include a valid JWT.
  bytes intent_sig = 14;
}

// Bit flags for InputEvent.buttons (Desktop x0009/x0013; VR Grab = grip / Select when dash closed).
enum InputButtons {
  INPUT_BUTTONS_NONE = 0;
  INPUT_BUTTONS_PRIMARY = 1;    // LMB / Y
  INPUT_BUTTONS_SECONDARY = 2;  // R / Mouse4
  INPUT_BUTTONS_GRAB = 4;       // RMB (Desktop look-capture) / XR grip (Select fallback when dash closed)
  INPUT_BUTTONS_CONTEXT = 8;    // T / MMB
  INPUT_BUTTONS_JUMP = 16;      // Space edge (Walk); continuous up uses move_y
}

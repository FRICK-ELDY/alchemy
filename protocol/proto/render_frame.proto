syntax = "proto3";

package alchemy.render;

// Slice C-C: high-frequency pose delta (where things are).
// Full snapshots and asset refs are deferred / live on SceneManifest.
// PROTOCOL_PIN must bump when this schema changes incompatibly.

message RenderFrame {
  // Publish sequence (net_tick). Missing ticks → …/snapshot (x0024). Not physics tick.
  uint64 tick = 1;
  // Wall-clock-ish host time in milliseconds (demo / debug / jitter).
  uint64 host_time_ms = 2;
  // Entities that spawned or moved since the last published frame.
  repeated Entity upserts = 3;
  // Entity ids removed from the scene.
  repeated uint32 removes = 4;
  // Ed25519 signature (64 bytes) over encode with `host_sig` cleared (x0023).
  // Verified with `SceneManifest.host_pub`.
  bytes host_sig = 5;
  // 60Hz physics tick (MVCC / XPBD). Distinct from `tick` (x00af).
  uint64 sim_tick = 6;
  // Redundant dirty window K (how many prior publishes this frame covers).
  // 0 = legacy single-interval synthesis; K=1 first (Q6). Never a per-receiver ACK.
  uint32 redundancy = 7;
  // Per user_root slot: last Intent `intent_seq` host applied (index = slot).
  // Length 0..USER_ROOT_SLOTS_MAX; absent slots read as 0 (x00af / owned prediction).
  repeated uint64 acked_intent_seq = 8;
}

message Entity {
  uint32 id = 1;
  // Spatial position at the render boundary (binary64 / f64).
  double x = 2;
  double y = 3;
  double z = 4;
  // Optional RGBA 0..1 (demo coloring; not an asset ref).
  float r = 5;
  float g = 6;
  float b = 7;
  float a = 8;
  // Unit quaternion (xyzw). Proto3 zeros are invalid — publishers must send
  // identity (0,0,0,1) when orientation is unused (x0029 / E1).
  double qx = 9;
  double qy = 10;
  double qz = 11;
  double qw = 12;
  // Non-uniform scale. Identity is (1,1,1). Proto3 zeros mean "unset" and
  // consumers treat as (1,1,1). Multiplies Manifest half_extent / mesh visual
  // size (definition × execution; x0029).
  double sx = 13;
  double sy = 14;
  double sz = 15;
  // Grab owner on the wire (x00af): 0 = none; 1..=USER_ROOT_SLOTS_MAX = slot + 1.
  uint32 holder = 16;
}

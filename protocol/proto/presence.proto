syntax = "proto3";

package alchemy.presence;

// x0015: low-frequency host presence (Token `sub` → user_root entity).
// Occupied slots only. PROTOCOL_PIN must bump when this schema changes incompatibly.

message PresenceState {
  // Bump when the assignment set changes; late-joiner republish may reuse revision.
  uint64 revision = 1;
  repeated PresenceAssignment assignments = 2;
}

message PresenceAssignment {
  // Room Token / auth JWT `sub` (user id UUID string).
  string sub = 1;
  // Host user_root entity id (x0015: 3..6).
  uint32 entity_id = 2;
}

# cargo-deny for alchemy-launcher (x0073 / P2-8).
# Run from `launcher/`: `cargo deny check`
#
# Policy mirrors relay-agent/: vulnerabilities deny; unmaintained/unsound not gated yet.

[graph]
all-features = false
no-default-features = false

[advisories]
unmaintained = "none"
unsound = "none"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "alchemy-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal process manager: spawn host + client, localhost IPC shutdown (x0032/x0047)"

[[bin]]
name = "alchemy-launcher"
path = "src/main.rs"

[dependencies]
alchemy-protocol = { path = "../protocol" }
anyhow = "1"
ctrlc = "3"
env_logger = "0.11"
getrandom = "0.2"
log = "0.4"

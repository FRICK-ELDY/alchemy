[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/host-server",
    "crates/client",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
alchemy-protocol = { path = "crates/protocol" }
prost = "0.14"
zenoh = "1.10"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
winit = "0.30"
wgpu = "24"
env_logger = "0.11"
log = "0.4"

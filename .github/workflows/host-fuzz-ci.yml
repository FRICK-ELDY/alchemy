name: Host cargo-fuzz

on:
  push:
    branches: ["**"]
    paths:
      - "client/host-server/**"
      - ".scripts/ci-fuzz.sh"
      - ".github/workflows/host-fuzz-ci.yml"
  pull_request:
    paths:
      - "client/host-server/**"
      - ".scripts/ci-fuzz.sh"
      - ".github/workflows/host-fuzz-ci.yml"

concurrency:
  group: host-fuzz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # x004c / P3-9: Room Token verify fuzz (lib + feature fuzzing).
  host-cargo-fuzz:
    name: "Rust — host-server cargo-fuzz smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client -> target
            client/host-server/fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz room_token_verify
        env:
          FUZZ_MAX_TOTAL_TIME: "10"
        run: ./.scripts/ci-fuzz.sh host

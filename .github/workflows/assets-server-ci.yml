name: Assets Server CI

on:
  push:
    branches: [main]
    paths:
      - "assets-server/**"
      - "shared/alchemy_auth_client/**"
      - "protocol/**"
      - ".github/workflows/assets-server-ci.yml"
  pull_request:
    paths:
      - "assets-server/**"
      - "shared/alchemy_auth_client/**"
      - "protocol/**"
      - ".github/workflows/assets-server-ci.yml"

concurrency:
  group: assets-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets-server

    env:
      MIX_ENV: test
      # x001e: never pick up accidental ASSETS_CAS_BACKEND=s3 from runner env
      ASSETS_CAS_BACKEND: local
      BLAKE3_HASH_BIN: ${{ github.workspace }}/protocol/target/release/blake3-hash

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build blake3-hash
        working-directory: protocol
        run: cargo build --release --bin blake3-hash

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            assets-server/deps
            assets-server/_build
          key: ${{ runner.os }}-assets-mix-${{ hashFiles('assets-server/mix.lock', 'shared/alchemy_auth_client/mix.lock', 'shared/alchemy_auth_client/lib/**/*.ex', 'shared/alchemy_auth_client/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-assets-mix-

      - run: mix deps.get
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      # Shared package tests: `.github/workflows/alchemy-auth-client-ci.yml` (avoid triple-run).
      - run: mix test

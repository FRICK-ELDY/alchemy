name: Alchemy Rate Limit CI

on:
  push:
    branches: [main]
    paths:
      - "shared/alchemy_rate_limit/**"
      - ".github/workflows/alchemy-rate-limit-ci.yml"
  pull_request:
    paths:
      - "shared/alchemy_rate_limit/**"
      - ".github/workflows/alchemy-rate-limit-ci.yml"

concurrency:
  group: alchemy-rate-limit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/alchemy_rate_limit

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            shared/alchemy_rate_limit/deps
            shared/alchemy_rate_limit/_build
          key: ${{ runner.os }}-alchemy-rate-limit-${{ hashFiles('shared/alchemy_rate_limit/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-alchemy-rate-limit-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

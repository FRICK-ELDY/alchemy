name: Protocol CI

on:
  push:
    branches: [main]
    paths:
      - "protocol/**"
      - ".scripts/ci-fuzz.sh"
      - ".github/workflows/protocol-ci.yml"
  pull_request:
    paths:
      - "protocol/**"
      - ".scripts/ci-fuzz.sh"
      - ".github/workflows/protocol-ci.yml"

concurrency:
  group: protocol-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto-verify:
    name: "Protobuf — schema compile"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile protobuf schemas
        run: |
          set -eux
          protoc --version
          protoc -I protocol/proto --include_imports \
            --descriptor_set_out=/tmp/alchemy-descriptor.pb \
            protocol/proto/render_frame.proto \
            protocol/proto/input_events.proto \
            protocol/proto/presence.proto \
            protocol/proto/scene_manifest.proto
          test -s /tmp/alchemy-descriptor.pb

  rust-test:
    name: "Rust — protocol crate tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: protocol -> target
      - run: cargo test

  # x004c / P3-9: short libFuzzer smoke (not part of make ci).
  cargo-fuzz:
    name: "Rust — protocol cargo-fuzz smoke"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            protocol -> target
            protocol/fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz protocol targets
        env:
          FUZZ_MAX_TOTAL_TIME: "8"
        run: ./.scripts/ci-fuzz.sh protocol

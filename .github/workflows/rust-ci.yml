name: Rust CI

on:
  push:
    branches: ["**"]
    paths:
      - "client/**"
      - "launcher/**"
      - "protocol/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "client/**"
      - "launcher/**"
      - "protocol/**"
      - ".github/workflows/rust-ci.yml"

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: "Rust — fmt & clippy"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target
      - name: Install system packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config
          libxkbcommon-dev libwayland-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings

  rust-deny:
    name: "Rust — cargo deny"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: client/Cargo.toml
          command: check

  rust-build:
    name: "Rust — build workspace"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target
      - name: Install system packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config
          libxkbcommon-dev libwayland-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo build --workspace

  # client のウィンドウ／GPU 依存テストは現状なし。
  rust-test:
    name: "Rust — test workspace"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target
      - name: Install system packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config
          libxkbcommon-dev libwayland-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo test --workspace

  # x0047 / P3-2: launcher is outside the client workspace; keep this job in sync with
  # `make ci-launcher` / `.scripts/ci.sh launcher`.
  # host cargo-fuzz: `.github/workflows/host-fuzz-ci.yml` (narrow paths).
  launcher-check:
    name: "Launcher — fmt clippy build test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher -> target
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo build
      - run: cargo test

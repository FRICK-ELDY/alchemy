name: World Server CI

on:
  push:
    branches: [main]
    paths:
      - "world-server/**"
      - "shared/alchemy_auth_client/**"
      - "shared/alchemy_client_ip/**"
      - ".github/workflows/world-server-ci.yml"
  pull_request:
    paths:
      - "world-server/**"
      - "shared/alchemy_auth_client/**"
      - "shared/alchemy_client_ip/**"
      - ".github/workflows/world-server-ci.yml"

concurrency:
  group: world-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-server

    env:
      MIX_ENV: test
      # x003b: pollution path must be ignored by runtime.exs in test.
      WORLD_DATABASE_PATH: /tmp/alchemy-world-test-must-ignore.db

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            world-server/deps
            world-server/_build
          key: ${{ runner.os }}-world-mix-${{ hashFiles('world-server/mix.lock', 'shared/alchemy_auth_client/mix.lock', 'shared/alchemy_auth_client/lib/**/*.ex', 'shared/alchemy_auth_client/mix.exs', 'shared/alchemy_client_ip/mix.lock', 'shared/alchemy_client_ip/lib/**/*.ex', 'shared/alchemy_client_ip/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-world-mix-

      - run: mix deps.get
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      # Shared package tests: `.github/workflows/alchemy-auth-client-ci.yml` (avoid triple-run).
      - run: mix test

name: E2E Compose (x001f)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.e2e.yml"
      - ".scripts/smoke-compose-e2e.sh"
      - "Makefile"
      - "client/Cargo.toml"
      - "client/Cargo.lock"
      - "client/e2e-probe/**"
      - "client/host-server/**"
      - "protocol/**"
      - "auth-server/**"
      - "world-server/**"
      - "assets-server/**"
      - "shared/alchemy_auth_client/**"
      - "shared/alchemy_client_ip/**"
      - "zenoh-router/config.json5"
      - ".github/workflows/e2e-compose.yml"
  push:
    branches: ["main"]
    paths:
      - "docker-compose.e2e.yml"
      - ".scripts/smoke-compose-e2e.sh"
      - "Makefile"
      - "client/Cargo.toml"
      - "client/Cargo.lock"
      - "client/e2e-probe/**"
      - "client/host-server/**"
      - "protocol/**"
      - "auth-server/**"
      - "world-server/**"
      - "assets-server/**"
      - "shared/alchemy_auth_client/**"
      - "shared/alchemy_client_ip/**"
      - "zenoh-router/config.json5"
      - ".github/workflows/e2e-compose.yml"

concurrency:
  group: e2e-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic-e2e:
    name: "Hermetic Compose E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system packages
        run: >
          sudo apt-get update && sudo apt-get install -y
          pkg-config curl
          libxkbcommon-dev libwayland-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - name: Compose up (hermetic)
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Smoke E2E
        env:
          HEALTH_WAIT_SECS: "300"
          HOST_READY_SECS: "120"
          E2E_TIMEOUT_SECS: "60"
        run: bash .scripts/smoke-compose-e2e.sh

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail=200

      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

name: Alchemy Auth Client CI

on:
  push:
    branches: [main]
    paths:
      - "shared/alchemy_auth_client/**"
      - ".github/workflows/alchemy-auth-client-ci.yml"
  pull_request:
    paths:
      - "shared/alchemy_auth_client/**"
      - ".github/workflows/alchemy-auth-client-ci.yml"

concurrency:
  group: alchemy-auth-client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/alchemy_auth_client

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            shared/alchemy_auth_client/deps
            shared/alchemy_auth_client/_build
          key: ${{ runner.os }}-alchemy-auth-client-mix-${{ hashFiles('shared/alchemy_auth_client/mix.lock', 'shared/alchemy_auth_client/lib/**/*.ex', 'shared/alchemy_auth_client/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-alchemy-auth-client-mix-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

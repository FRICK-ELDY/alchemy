name: Prod Compose Smoke

on:
  push:
    branches: [main]
    paths:
      - "auth-server/docker-compose.prod.yml"
      - "auth-server/.env.prod.example"
      - "world-server/docker-compose.prod.yml"
      - "world-server/.env.prod.example"
      - ".scripts/smoke-prod-compose.sh"
      - ".github/workflows/prod-compose-smoke.yml"
  pull_request:
    paths:
      - "auth-server/docker-compose.prod.yml"
      - "auth-server/.env.prod.example"
      - "world-server/docker-compose.prod.yml"
      - "world-server/.env.prod.example"
      - ".scripts/smoke-prod-compose.sh"
      - ".github/workflows/prod-compose-smoke.yml"

concurrency:
  group: prod-compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prod compose config (x003b S2S)
        run: bash .scripts/smoke-prod-compose.sh

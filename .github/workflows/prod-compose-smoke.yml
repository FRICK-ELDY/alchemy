name: Prod Compose Smoke

on:
  push:
    branches: [main]
    paths:
      - "auth-server/docker-compose.prod.yml"
      - "auth-server/.env.prod.example"
      - "world-server/docker-compose.prod.yml"
      - "world-server/.env.prod.example"
      - ".scripts/smoke-prod-compose.sh"
      - ".github/workflows/prod-compose-smoke.yml"
  pull_request:
    paths:
      - "auth-server/docker-compose.prod.yml"
      - "auth-server/.env.prod.example"
      - "world-server/docker-compose.prod.yml"
      - "world-server/.env.prod.example"
      - ".scripts/smoke-prod-compose.sh"
      - ".github/workflows/prod-compose-smoke.yml"
  workflow_dispatch:
    inputs:
      up:
        description: "SMOKE_PROD_UP=1 — build/start auth+world and hit /health (slow)"
        type: boolean
        default: false

concurrency:
  group: prod-compose-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prod compose config (x003b S2S)
        run: bash .scripts/smoke-prod-compose.sh

  # Optional full boot — release images are slow; PR default stays config-only.
  health:
    # boolean input may arrive as true or the string "true" depending on runner/UI.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.up == true || inputs.up == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: prod compose /health (x003b)
        env:
          SMOKE_PROD_UP: "1"
          HEALTH_WAIT_SECS: "600"
        run: bash .scripts/smoke-prod-compose.sh

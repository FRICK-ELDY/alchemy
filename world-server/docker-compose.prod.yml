# Public / Tunnel origin (x001e). Prefer over docker-compose.yml (dev) behind Cloudflare.
#
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Guarantees: MIX_ENV=prod release image (no hot-reload bind mount).
# Named volume `world_prod_keys` holds both Room Token PEM and SQLite DB under
# `/var/lib/world` (x001e keys + x0028 ledger). Recreate **without** removing
# that volume keeps the key and rooms; `docker compose down -v` regenerates the
# key (**invalidates Room Tokens**) and wipes the room ledger.
#
# x0066 client CA (optional WAN):
#   - Bind `./priv/mtls` → `/etc/alchemy/mtls:ro` (outside `/var/lib/world` —
#     entrypoint chown on that tree would fail on a :ro mount).
#   - Set MTLS_CA_*_PATH in `.env.prod` only when files exist; unset = Token only.
#   - Host key must be readable by container user `world` (`:ro` cannot chown).
#     Example: `chown <world_uid>:<world_gid> priv/mtls/client-ca-key.pem && chmod 600 …`
#     (`docker compose run --rm --entrypoint id world` → uid/gid).

services:
  world:
    build:
      context: ..
      dockerfile: world-server/Dockerfile
      target: release
    ports:
      - "4003:4003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHX_SERVER: "true"
      PORT: "4003"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env.prod}
      ROOM_TOKEN_PRIVATE_KEY_PATH: /var/lib/world/room_jwt_private.pem
      ROOM_TOKEN_GENERATE_KEY: "true"
      WORLD_ALLOW_ANON_TOKENS: "false"
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://host.docker.internal:4002/.well-known/jwks.json}
      # x003b: S2S — must match auth-server AUTH_INTERNAL_TOKEN.
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://host.docker.internal:4002}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:?set AUTH_INTERNAL_TOKEN in .env.prod}
      WORLD_DATABASE_PATH: /var/lib/world/world.db
      # x0066: optional — only from .env.prod when CA is mounted (no compose defaults).
      MTLS_CA_CERT_PATH: ${MTLS_CA_CERT_PATH:-}
      MTLS_CA_KEY_PATH: ${MTLS_CA_KEY_PATH:-}
    volumes:
      - world_prod_keys:/var/lib/world
      # Optional; empty dir is fine if MTLS_CA_* unset. Never nest under /var/lib/world.
      - ./priv/mtls:/etc/alchemy/mtls:ro

volumes:
  world_prod_keys:

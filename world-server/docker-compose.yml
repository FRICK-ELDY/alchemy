services:
  world:
    build:
      context: ..
      dockerfile: world-server/Dockerfile
      target: dev
    ports:
      - "4003:4003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MIX_ENV: dev
      PHX_SERVER: "true"
      BIND_ALL: "true"
      PORT: "4003"
      ROOM_TOKEN_PRIVATE_KEY_PATH: /app/priv/room_jwt_private.pem
      ROOM_TOKEN_GENERATE_KEY: "true"
      WORLD_ALLOW_ANON_TOKENS: "false"
      AUTH_JWKS_URL: http://host.docker.internal:4002/.well-known/jwks.json
      WORLD_DATABASE_PATH: /app/priv/data/world_dev.db
    volumes:
      - .:/app
      - ../shared/alchemy_auth_client:/shared/alchemy_auth_client
      - world_deps:/app/deps
      - world_build:/app/_build
      - world_data:/app/priv/data
    command: >
      sh -c "mix deps.get &&
             mix ash.setup &&
             mix compile &&
             mix phx.server"

volumes:
  world_deps:
  world_build:
  world_data:

services:
  assets:
    build:
      context: ..
      dockerfile: assets-server/Dockerfile
      target: dev
    ports:
      - "4004:4004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MIX_ENV: dev
      PHX_SERVER: "true"
      BIND_ALL: "true"
      PORT: "4004"
      DATABASE_PATH: /app/priv/assets_dev.sqlite3
      ASSETS_CAS_PATH: /app/priv/cas
      AUTH_JWKS_URL: http://host.docker.internal:4002/.well-known/jwks.json
      # x001c: set in assets-server/.env (gitignored). Default stays local.
      ASSETS_CAS_BACKEND: ${ASSETS_CAS_BACKEND:-local}
      ASSETS_S3_BUCKET: ${ASSETS_S3_BUCKET:-}
      ASSETS_S3_ENDPOINT: ${ASSETS_S3_ENDPOINT:-}
      ASSETS_S3_ACCESS_KEY_ID: ${ASSETS_S3_ACCESS_KEY_ID:-}
      ASSETS_S3_SECRET_ACCESS_KEY: ${ASSETS_S3_SECRET_ACCESS_KEY:-}
      ASSETS_S3_REGION: ${ASSETS_S3_REGION:-auto}
      ASSETS_S3_PREFIX: ${ASSETS_S3_PREFIX:-cas/}
      ASSETS_S3_PRESIGN_TTL_SECONDS: ${ASSETS_S3_PRESIGN_TTL_SECONDS:-300}
    volumes:
      - .:/app
      - ../shared/alchemy_auth_client:/shared/alchemy_auth_client
      - assets_deps:/app/deps
      - assets_build:/app/_build
    command: >
      sh -c "mix deps.get &&
             mix ecto.create &&
             mix ecto.migrate &&
             mix phx.server"

volumes:
  assets_deps:
  assets_build:
